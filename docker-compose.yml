services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hr_voice_poc}
      POSTGRES_USER: ${POSTGRES_USER:-hr_voice_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hr_voice_user} -d ${POSTGRES_DB:-hr_voice_poc}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
